// LumenTube: a separate Gradle build inside the SmartTube fork. It compiles SmartTube's engine
// (MediaServiceCore, SharedModules, the ExoPlayer fork with SABR) from the parent folders, as-is:
// none of the upstream files is modified, so merging a new SmartTube version never conflicts.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'LumenTube'
include ':app'

def upstream = new File(settingsDir, '..').canonicalFile
gradle.ext.upstreamRoot = upstream
// Read by the upstream build files (module prefix of the ExoPlayer fork).
gradle.ext.exoplayerModulePrefix = 'exoplayer-'

def module = { String name, String dir ->
    include name
    project(name).projectDir = new File(upstream, dir)
}

// SharedModules (helpers, OkHttp, prefs, JS engine for YouTube's signatures)
module(':sharedutils', 'SharedModules/sharedutils')
module(':sharedtests', 'SharedModules/sharedtests')
module(':commons-io-2.8.0', 'SharedModules/commons-io-2.8.0')
module(':j2v8', 'SharedModules/j2v8')

// MediaServiceCore (YouTube API: home, subscriptions, sign-in, formats, SponsorBlock…)
module(':mediaserviceinterfaces', 'MediaServiceCore/mediaserviceinterfaces')
module(':youtubeapi', 'MediaServiceCore/youtubeapi')

// ExoPlayer 2.10.6 fork (DASH, HLS, SABR — YouTube's new streaming protocol)
module(':exoplayer-library-core', 'exoplayer-amzn-2.10.6/library/core')
module(':exoplayer-library-dash', 'exoplayer-amzn-2.10.6/library/dash')
module(':exoplayer-library-sabr', 'exoplayer-amzn-2.10.6/library/sabr')
module(':exoplayer-library-hls', 'exoplayer-amzn-2.10.6/library/hls')
module(':exoplayer-library-smoothstreaming', 'exoplayer-amzn-2.10.6/library/smoothstreaming')
module(':exoplayer-library-ui', 'exoplayer-amzn-2.10.6/library/ui')
module(':exoplayer-extension-okhttp', 'exoplayer-amzn-2.10.6/extensions/okhttp')
module(':exoplayer-extension-cronet', 'exoplayer-amzn-2.10.6/extensions/cronet')
// Only referenced by the upstream unit tests (declared, never built here).
module(':exoplayer-library', 'exoplayer-amzn-2.10.6/library/all')
module(':exoplayer-testutils', 'exoplayer-amzn-2.10.6/testutils')
module(':exoplayer-testutils-robolectric', 'exoplayer-amzn-2.10.6/testutils_robolectric')
