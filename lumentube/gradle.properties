org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
# Upstream modules still pull a few old support-library artifacts.
android.enableJetifier=true
android.jetifier.ignorelist=bcprov
# Upstream code relies on AGP 7 defaults: R classes of dependencies, R ids usable in switch.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.suppressUnsupportedCompileSdk=34,35
kotlin.code.style=official
# Lumen's signing certificate (SHA-256 of its release cert, public, not a secret): the only app the
# feed provider answers. Overridable with the LUMEN_CERT_SHA256 environment variable.
lumen.certSha256=033659f59e0385e360fe3ce7cfd59eb90c25854950e40a209f91e6388a44b79f
