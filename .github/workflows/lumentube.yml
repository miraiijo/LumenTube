name: LumenTube APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "lumentube/**"
      - "MediaServiceCore"
      - "SharedModules"
      - "exoplayer-amzn-2.10.6/**"
      - ".github/workflows/lumentube.yml"

# Read-only token: the build publishes nothing (the APK is a workflow artifact, installed with
# lumentube-install.sh). No release on this public fork, so the signed APK is never public.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Whether the signing secrets exist, without putting the keystore itself in the job's env.
      HAS_KEYSTORE: ${{ secrets.LUMENTUBE_KEYSTORE_B64 != '' }}
    steps:
      # Third-party actions pinned to a commit (v4 at the time of writing), not to a movable tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive # SmartTube's engine (MediaServiceCore, SharedModules)
          persist-credentials: false # the token isn't left in .git/config for the build steps

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle's wrapper validation scans the whole repo and rejects SmartTube's own wrappers
      # (root and exoplayer-amzn-2.10.6), which this build never runs. Only LumenTube's wrapper is
      # executed, so only that one is checked, against Gradle's published checksum.
      - name: Validate LumenTube's Gradle wrapper
        run: |
          version=$(grep -oP 'gradle-\K[0-9.]+(?=-bin\.zip)' lumentube/gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          actual=$(sha256sum lumentube/gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          echo "Gradle $version wrapper: expected $expected, got $actual"
          test "$expected" = "$actual"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: false
          validate-wrappers: false

      # The keystore only exists in this step's env and in a temp file.
      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          LUMENTUBE_KEYSTORE_B64: ${{ secrets.LUMENTUBE_KEYSTORE_B64 }}
        run: |
          echo "$LUMENTUBE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lumentube.jks"
          echo "LUMENTUBE_KEYSTORE_PATH=$RUNNER_TEMP/lumentube.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: lumentube
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --build-cache :app:assembleRelease
        env:
          LUMENTUBE_KEYSTORE_PASSWORD: ${{ secrets.LUMENTUBE_KEYSTORE_PASSWORD }}
          LUMENTUBE_KEY_ALIAS: ${{ secrets.LUMENTUBE_KEY_ALIAS }}
          LUMENTUBE_KEY_PASSWORD: ${{ secrets.LUMENTUBE_KEY_PASSWORD }}

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lumentube.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumentube-apk
          path: lumentube/app/build/outputs/apk/release/*.apk
          retention-days: 30
