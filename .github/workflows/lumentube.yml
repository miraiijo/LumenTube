name: LumenTube APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "lumentube/**"
      - "MediaServiceCore"
      - "SharedModules"
      - "exoplayer-amzn-2.10.6/**"
      - ".github/workflows/lumentube.yml"

# Build and check only: the APK comes out UNSIGNED. Signing and publishing happen on the Mac
# (lumen-ship: the key never leaves it), so there is no secret at all in GitHub. Read-only token:
# this workflow publishes nothing (the APK is a workflow artifact, signed by lumentube-install.sh
# or lumen-ship, then published on miraiijo/lumen-releases).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to a commit (v4 at the time of writing), not to a movable tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive # SmartTube's engine (MediaServiceCore, SharedModules)
          persist-credentials: false # the token isn't left in .git/config for the build steps

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle's wrapper validation scans the whole repo and rejects SmartTube's own wrappers
      # (root and exoplayer-amzn-2.10.6), which this build never runs. Only LumenTube's wrapper is
      # executed, so only that one is checked, against Gradle's published checksum.
      - name: Validate LumenTube's Gradle wrapper
        run: |
          version=$(grep -oP 'gradle-\K[0-9.]+(?=-bin\.zip)' lumentube/gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          actual=$(sha256sum lumentube/gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          echo "Gradle $version wrapper: expected $expected, got $actual"
          test "$expected" = "$actual"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Build release APK
        working-directory: lumentube
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --build-cache :app:assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: lumentube
        run: |
          # Compiler / Gradle errors as one annotation (readable from the API without the log download).
          msg=$(grep -E '^e: |^\* What went wrong|error:|FAILED|Exception' build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg:-no matching lines}"
          msg2=$(grep -A12 '^\* What went wrong' build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$msg2" ] && echo "::error title=What went wrong::$msg2" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumentube-unsigned
          path: lumentube/app/build/outputs/apk/release/*.apk
          retention-days: 30
